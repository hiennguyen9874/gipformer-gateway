[project]
name = "gipformer-gateway"
version = "0.0.0"
description = "OpenAI-compatible (scoped) serving for QUAN-Transcribe-1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Inference code pinned to an exact commit (docs/baseline.vi.md, assets/manifest.json).
    "quan-transcribe @ git+https://github.com/qnguyen3/QUAN-Transcribe@88ddcd2130a3c355d081bc002439f29e5e849060",
    # Pinned together with the model in assets/manifest.json (tests/unit/test_manifests.py).
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "transformers==5.19.0",
    "huggingface_hub",
    "safetensors",
    "numpy",
    "soundfile>=0.12",
    "soxr",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.20",
    "websockets>=13,<16",
]

# Select exactly one runtime profile: uv sync --extra cu126 (baseline) or --extra cu128 (Blackwell).
# PyTorch does not publish 2.14.1 cu128 wheels; keep the existing cu126 baseline unchanged.
[project.optional-dependencies]
cu126 = ["torch==2.14.1"]
cu128 = ["torch==2.11.0"]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit>=4.7.0",
    # Pinned SDK used to verify the API contract (docs/api-contract.vi.md).
    "openai[realtime]==3.31.0",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cu126" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA GPU and staged model assets (scripts/stage_models.py)",
    "container: needs docker (runtime checks: NVIDIA Container Toolkit, GIPFORMER_GPU, staged models)",
]
